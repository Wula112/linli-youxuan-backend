server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    # 分片节点在 application-sharding.yaml 配置；以下用户名/密码默认供两个节点继承。
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: ${DB_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
mybatis-plus:
  type-aliases-package: com.hmdp.entity
hmdp:
  rocketmq:
    # 5.x 服务端：定时消息按支付超时精确投递
    name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
    producer-group: hmdp-producer
    send-timeout: 3s
    retry-times-when-send-failed: 2
    # 消费失败重投次数，耗尽后进入 %DLQ%<consumer-group>
    max-reconsume-times: 2
    consume-threads: 4
    transaction-check-threads: 4
  job:
    # local与xxl互斥；XXL配置见application-xxl.yaml
    scheduler: local
    max-run-time: 30s
  order:
    pay-timeout: 15m
    timeout-scan-enabled: true
    timeout-scan-interval: 1m
    timeout-scan-batch-size: 100
  seckill:
    rate-limit:
      # 所有实例、所有优惠券共用秒杀接口窗口；此为初始值，应按压测结果调整
      window: 1s
      limit: 100
    reconcile:
      enabled: true
      interval: 1m
      pending-timeout: 5m
      batch-size: 100
      # 每笔订单最多补发5轮；每轮内部仍按producer-max-attempts重试，0表示禁用补发
      max-republish-retries: 5
  cache:
    warmup:
      enabled: false
      # 空名单按活动自动筛选；分类始终预热。
      hot-shop-ids: []
      ahead-of-start: 10m
      max-shops: 100
      shop-list-ttl: 5m
    mq:
      enabled: true
    shop-type:
      # 两类数据分别配置模式，压测时互不影响
      mode: caffeine
      maximum-size: 1
      refresh-after-write: 5s
      expire-after-write: 10m
      redis-ttl: 30m
    voucher-list:
      # mysql：仅DB；redis：Redis + DB；caffeine：本地缓存 + Redis + DB
      mode: caffeine
      maximum-size: 1000
      refresh-after-write: 5s
      expire-after-write: 10m
      redis-ttl: 10m
logging:
  level:
    com.hmdp: debug
